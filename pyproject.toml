[project]
name = "connectid"
version = "0.0.1"
requires-python = "==3.11.*"
dependencies = [
    "boto3==1.43.88",
    "celery==5.6.3",
    "django>=5.2,<5.3",
    "django-allow-cidr==0.8.0",
    "django-anymail[amazon-ses]>=15.0",
    "django-axes[ipware]==8.3.1",
    "django-celery-beat==2.9.0",
    "django-environ==0.14.0",
    "django-oauth-toolkit==3.4.1",
    "django-otp==1.7.2",
    "django-phonenumber-field==8.5.0",
    "django-waffle==5.0.0",
    "djangorestframework==3.18.0",
    "fcm-django==3.2.0",
    "geopy==2.5.0",
    "google-api-python-client==2.200.0",
    "google-auth==2.57.1",
    "google-cloud-bigquery>=3.45.0",
    "gunicorn==26.2.0",
    "phonenumberslite==9.0.38",
    "psycopg2==2.9.12",
    "redis==8.1.0",
    "sentry-sdk[django]==2.68.1",
    "twilio==9.11.0",
    "whitenoise==6.12.0",
    "zxcvbn==4.5.0",
]

[dependency-groups]
dev = [
    "factory-boy==3.3.3",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-django==4.14.0",
    "ruff>=0.16.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "connectid.settings"
addopts = "--reuse-db"
python_files = [
    "tests.py",
    "test_*.py",
]

# ==== ruff ====
[tool.ruff]
line-length = 119
target-version = "py311"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes (flake8 defaults), I: isort
select = ["E", "W", "F", "I"]

[tool.ruff.lint.isort]
# Matches the previous isort "black" profile behaviour.
known-first-party = ["connectid"]

# ==== PyLint ====
[tool.pylint.MASTER]
load-plugins = [
    "pylint_django",
    "pylint_celery",
]
django-settings-module = "connectid.settings"

[tool.pylint.FORMAT]
max-line-length = 119

[tool.pylint."MESSAGES CONTROL"]
disable = [
    "missing-docstring",
    "invalid-name",
]

[tool.pylint.DESIGN]
max-parents = 13

[tool.pylint.TYPECHECK]
generated-members = [
    "REQUEST",
    "acl_users",
    "aq_parent",
    "[a-zA-Z]+_set{1,2}",
    "save",
    "delete",
]
