  clear:
    BIGQUERY_CONFIGURATION_SESSION_TABLE: 'personalid_config_sessions'
    BIGQUERY_DATASET_ID: 'analytics_153906101'
    COMMCARE_CONNECT_CLIENT_ID: '89kwTID4ZQ4ZgqofrcnhQ19Qf0vbAvJm87PwM2fT'
    CSRF_TRUSTED_ORIGINS: 'https://connectid.dimagi.com,https://connect.dimagi.com,https://ec2-54-174-77-95.compute-1.amazonaws.com'
    DEFAULT_FROM_EMAIL: 'personalid-noreply@dimagi.com'
    DJANGO_ALLOWED_CIDR_NETS: '172.31.0.0/16'
    DJANGO_ALLOWED_HOSTS: 'connectid.dimagi.com,connect.dimagi.com,ec2-54-174-77-95.compute-1.amazonaws.com,127.0.0.1'
    DJANGO_EMAIL_BACKEND: 'anymail.backends.amazon_ses.EmailBackend'
    FCM_CLIENT_EMAIL: 'firebase-adminsdk-5g9cf@commcare-a57e4.iam.gserviceaccount.com'
    FCM_CLIENT_ID: '107009008224476873861'
    FCM_CLIENT_X509_CERT_URL: 'https://www.googleapis.com/robot/v1/metadata/x509/firebase-adminsdk-5g9cf%40commcare-a57e4.iam.gserviceaccount.com'
    FCM_PROJECT_ID: 'commcare-a57e4'
    FIREBASE_APP_ID: '1:768065119425:android:bf4b2396fb9805b2'
    GOOGLE_CLIENT_EMAIL: 'connectid@commcare-a57e4.iam.gserviceaccount.com'
    GOOGLE_CLIENT_ID: '110472826955406601952'
    GOOGLE_CLIENT_X509_CERT_URL: 'https://www.googleapis.com/robot/v1/metadata/x509/connectid%40commcare-a57e4.iam.gserviceaccount.com'
    GOOGLE_PROJECT_ID: 'commcare-a57e4'
    OCS_CULTURAL_NAME_BOT_ID: '62c71ed1-3baa-4dd0-8efc-17cf802e0a1a'
    RICH_MESSAGING_ENABLED: 'True'
    SUPERSET_UPLOAD_BASE_URL: 'https://connect-superset.dimagi.com'
