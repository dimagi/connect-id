# Deploy to these servers.
servers:
  web:
    hosts:
      - i-053c44cb9426822d0
    logging:
      options:
        awslogs-group: 'connect-id-web'
  celery:
    hosts:
      - i-090b0c432298694c5
    cmd: /start_celery
    logging:
      options:
        awslogs-group: 'connect-id-celery'
  celery-beat:
    hosts:
      - i-090b0c432298694c5
    cmd: /start_celery_beat
    logging:
      options:
        awslogs-group: 'connect-id-celery'

# kamal-proxy runs on the web host only (the primary role); the celery roles are not proxied.
# TLS ends at the ALB in front of the web host, so no `ssl` or `host` here: the proxy serves
# plain HTTP on port 80 and forwards every request to the app.
proxy:
  app_port: 8000
  # Required: keeps the ALB's X-Forwarded-For, to which kamal-proxy then appends the ALB's address. The app reads
  # the client two entries from the right (NUM_PROXIES=2: the ALB, then kamal-proxy). Without it the header would
  # hold only the ALB's address. It is the default while ssl is off, but stated so turning ssl on can't drop it.
  forward_headers: true
  healthcheck:
    path: /up
    interval: 5
    timeout: 5
  run:
    # kamal-proxy logs every request with its path and full query string, which can hold phone numbers
    # (e.g. ?phone_number=) and tokens (/status/?token=), and it has no option to turn that off or redact it.
    # So its logs stay on the host, in a small rotated file read with `kamal proxy logs`, and are not shipped to
    # CloudWatch like the app's.
    options:
      log-driver: json-file

# The web container runs migrations before starting gunicorn (docker/start_migrate),
# so allow time for a slow migration before the deploy gives up on /up.
deploy_timeout: 200

registry:
  server: 037129986032.dkr.ecr.us-east-1.amazonaws.com
  username: AWS
  password:
    - KAMAL_REGISTRY_PASSWORD

logging:
  driver: awslogs
  options:
    awslogs-region: 'us-east-1'
    # Each role sets its own group
    awslogs-group: 'connect-id'

builder:
  arch: amd64
  dockerfile: '../Dockerfile'
  context: '../'
