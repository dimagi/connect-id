service: connectid

# Name of the container image.
image: connectid

ssh:
  user: connect
  proxy_command: "aws ssm start-session --target %h --document-name AWS-StartSSHSession --parameters 'portNumber=%p'"

# Deploy to these servers.
servers:
  web:
    hosts:
      - i-053c44cb9426822d0
    options:
      env-file: '/home/connect/www/docker.env'
    logging:
      options:
        awslogs-group: 'connect-id-web'
  celery:
    hosts:
      - i-090b0c432298694c5
    options:
      env-file: '/home/connect/www/docker.env'
    cmd: /start_celery
    labels:
      traefik.enable: false
    logging:
      options:
        awslogs-group: 'connect-id-celery'
  celery-beat:
    hosts:
      - i-090b0c432298694c5
    options:
      env-file: '/home/connect/www/docker.env'
    cmd: /start_celery_beat
    labels:
      traefik.enable: false
    logging:
      options:
        awslogs-group: 'connect-id-celery'

registry:
  server: 037129986032.dkr.ecr.us-east-1.amazonaws.com
  username: AWS
  password: <%= %x(./config/registry_password.sh) %>

logging:
  driver: awslogs
  options:
    awslogs-region: 'us-east-1'
    # Traefik only gets these global options; the roles set their own groups.
    awslogs-group: 'connect-id'

builder:
  multiarch: false
  dockerfile: '../Dockerfile'
  context: '../'

traefik:
  args:
    # Keep the X-Forwarded-For entries the ALB adds; Traefik deletes them from untrusted sources. The app reads the
    # client from them (NUM_PROXIES). Only applied by `kamal traefik reboot`, not by a deploy.
    # Defining any entrypoint drops Traefik's default one on :80, so the address has to be given too.
    entrypoints.http.address: ':80'
    entrypoints.http.forwardedheaders.trustedips: '172.31.0.0/16'

healthcheck:
  path: /up
  port: 8000
  max_attempts: 10
  interval: 20s
