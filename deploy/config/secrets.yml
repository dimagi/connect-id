# The app's secrets, stored as one JSON secret (connect-id/production) in AWS Secrets Manager and deployed by Kamal.
# Manage the values with deploy/bin/production_secret.py (README, "Production Deploy").
#
# NAME: type, where type says how settings.py reads the value:
#   (blank)    plain: one line, as is
#   multiline  env.str(..., multiline=True), e.g. a PEM key
#   json       json.loads
#
# A new secret also needs a line in deploy/.kamal/secrets (deploy/tests/test_production_secret.py checks).
# env.secret in config/deploy.yml reads this file, so nothing to add there.

SECRET_KEY:
DATABASE_URL:
CELERY_BROKER_URL:
TWILIO_ACCOUNT_SID:
TWILIO_AUTH_TOKEN:
FCM_PRIVATE_KEY: multiline
FCM_PRIVATE_KEY_ID:
GOOGLE_PRIVATE_KEY: multiline
GOOGLE_PRIVATE_KEY_ID:
OIDC_RSA_PRIVATE_KEY: multiline
BIGQUERY_GOOGLE_CREDENTIALS_JSON: json
OCS_API_KEY:
GA_API_SECRET:
SUPERSET_UPLOAD_PASSWORD:
COMMCARE_CONNECT_CLIENT_SECRET:
MAPBOX_ACCESS_TOKEN:
SENTRY_DSN:
HEALTH_CHECK_TOKENS:
