name: CI

# Enable Buildkit and let compose use it to speed up image building
env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

on:
  pull_request:
    branches: ['main']

  push:
    branches: ['main']

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.0

  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres

    env:
      DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/postgres'

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Dependencies
        run: uv sync --frozen

      - name: Test with pytest
        run: uv run pytest

  # Kamal changes some characters of a secret on its way from Secrets Manager to the container, and
  # deploy/bin/production_secret.py stores values so that they come out unchanged. This checks that against the
  # Kamal and dotenv versions in deploy/Gemfile.lock, so a Kamal upgrade that changes the escaping fails here.
  kamal-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Set up Ruby and Kamal
        uses: ruby/setup-ruby@v1
        with:
          working-directory: ./deploy
          bundler-cache: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Round-trip secrets through Kamal
        working-directory: ./deploy
        run: uv run tests/kamal_roundtrip.py
