name: Deploy
run-name: Deploy to ${{ inputs.environment || 'production' }} (${{ inputs.deploy_type || 'scheduled' }})

env:
  AWS_REGION: 'us-east-1'
  SENTRY_ORG: 'dimagi'
  SENTRY_PROJECT: 'connect-id'
  # Scheduled runs have no inputs, so fall back to the defaults
  DEPLOY_ENVIRONMENT: ${{ inputs.environment || 'production' }}

permissions:
  id-token: write
  contents: write

on:
  schedule:
    # 12:00 UTC on Monday, Wednesday and Friday
    - cron: '0 12 * * 1,3,5'
  #  workflow_run:
  #    workflows: [CI]
  #    types: [completed]
  #    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        required: true
        default: 'production'
        type: choice
        options:
          - production
      deploy_type:
        description: 'Whether this deploy is part of the regular schedule or an adhoc/hotfix deploy'
        required: true
        default: 'scheduled'
        type: choice
        options:
          - scheduled
          - adhoc

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      # Scheduled deploys only go out when there is something new on main and CI passed on it.
      # Manual deploys always go ahead.
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Releases are only created by successful deploys, so the latest one marks what is live
          last_release_tag=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // ""')
          if [ -n "$last_release_tag" ]; then
            last_deployed_sha=$(gh api "repos/$GH_REPO/commits/$last_release_tag" --jq .sha)
            if [ "$last_deployed_sha" = "$GITHUB_SHA" ]; then
              echo "::notice::Nothing new since the last release ($last_release_tag), skipping deploy."
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          ci_conclusion=$(gh run list --workflow ci.yaml --event push --commit "$GITHUB_SHA" --limit 1 \
            --json conclusion --jq '.[0].conclusion // ""')
          if [ "$ci_conclusion" != "success" ]; then
            echo "::warning::CI has not passed on $GITHUB_SHA (${ci_conclusion:-no run found}), skipping deploy."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_deploy=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set release identifier
        run: |
          # Sentry release versions cannot contain slashes, so sanitize the ref name
          SAFE_REF_NAME="${GITHUB_REF_NAME//\//-}"
          echo "APP_RELEASE=${SAFE_REF_NAME}.${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Set up Ruby
        uses: actions/setup-ruby@v1

      - name: Install Kamal
        run: gem install kamal -v '~> 1.9.2'

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2.5.1
        with:
          key: ${{ secrets.SSH_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
          config: |
            Host *
              StrictHostKeyChecking no
              UserKnownHostsFile=/dev/null

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v3.0.1
        with:
          role-to-assume: arn:aws:iam::037129986032:role/github_deploy
          role-session-name: GithubDeploy
          aws-region: ${{ env.AWS_REGION }}

      - id: slack
        name: Notify Deploy Start
        uses: slackapi/slack-github-action@v1.24.0
        with:
          channel-id: 'C09HWCJSVJ6'
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                      "type": "mrkdwn",
                      "text": "*PersonalID Deploy to ${{ env.DEPLOY_ENVIRONMENT }}*"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                      "type": "mrkdwn",
                      "text": "*Status*: In Progress"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                      {
                          "type": "mrkdwn",
                          "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Deploy Run>"
                      }
                  ]
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN}}

      - id: deploy
        working-directory: ./deploy
        run: 'kamal deploy'

      - name: Create Sentry release
        if: ${{ success() }}
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        with:
          environment: ${{ env.DEPLOY_ENVIRONMENT }}
          release: ${{ env.APP_RELEASE }}
          projects: ${{ env.SENTRY_PROJECT }}
          set_commits: manual
          repo: dimagi/connect-id
          commit: ${{ github.sha }}

      - name: Set release tag
        if: ${{ success() && env.DEPLOY_ENVIRONMENT == 'production' }}
        run: echo "RELEASE_TAG=$(date -u +'%Y-%m-%d_%H-%M-%S')" >> "$GITHUB_ENV"

      - name: Create GitHub release
        if: ${{ success() && env.DEPLOY_ENVIRONMENT == 'production' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true

      - name: Notify Deploy End
        uses: slackapi/slack-github-action@v1.24.0
        if: always()
        with:
          channel-id: 'C09HWCJSVJ6'
          update-ts: ${{ steps.slack.outputs.ts }}
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                      "type": "mrkdwn",
                      "text": "*PersonalID Deploy to ${{ env.DEPLOY_ENVIRONMENT }}*"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                      "type": "mrkdwn",
                      "text": "*Status*: ${{ steps.deploy.conclusion }}"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                      {
                          "type": "mrkdwn",
                          "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Deploy Run>"
                      }
                  ]
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN}}
