name: Deploy
run-name: Deploy to ${{ inputs.environment }} (${{ inputs.deploy_type }})

env:
  AWS_REGION: 'us-east-1'
  SENTRY_ORG: 'dimagi'
  SENTRY_PROJECT: 'connect-id'

permissions:
  id-token: write
  contents: write
  deployments: write

on:
  #  workflow_run:
  #    workflows: [CI]
  #    types: [completed]
  #    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        required: true
        default: 'production'
        type: choice
        options:
          - production
      deploy_type:
        description: 'Whether this deploy is part of the regular schedule or an adhoc/hotfix deploy'
        required: true
        default: 'scheduled'
        type: choice
        options:
          - scheduled
          - adhoc

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set release identifier
        run: |
          # Sentry release versions cannot contain slashes, so sanitize the ref name
          SAFE_REF_NAME="${GITHUB_REF_NAME//\//-}"
          echo "APP_RELEASE=${SAFE_REF_NAME}.${GITHUB_SHA}" >> "$GITHUB_ENV"

      # Record the deploy in GitHub's Deployments API so the environment shows what is running there.
      # Created explicitly rather than via the job-level `environment:` key, which would change the
      # OIDC subject used to assume the AWS deploy role and apply environment protection rules.
      # Bookkeeping only: a failure here must not block the deploy.
      - id: gh_deployment
        name: Create GitHub deployment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_ENV: ${{ inputs.environment }}
          DEPLOY_TYPE: ${{ inputs.deploy_type }}
        run: |
          # required_contexts=[] skips GitHub's commit-status check; CI gating is the deploy process's job
          DEPLOYMENT_ID="$(jq -n \
            --arg ref "${GITHUB_SHA}" \
            --arg environment "${DEPLOY_ENV}" \
            --arg description "${DEPLOY_TYPE} deploy of ${GITHUB_REF_NAME}" \
            --argjson production "${{ inputs.environment == 'production' }}" \
            '{ref: $ref, environment: $environment, description: $description, auto_merge: false,
              required_contexts: [], production_environment: $production}' \
            | gh api "repos/${GITHUB_REPOSITORY}/deployments" --input - --jq '.id')"
          echo "id=${DEPLOYMENT_ID}" >> "$GITHUB_OUTPUT"
          gh api "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f state=in_progress \
            -f log_url="${LOG_URL}" > /dev/null

      - name: Set up Ruby
        uses: actions/setup-ruby@v1

      - name: Install Kamal
        run: gem install kamal -v '~> 1.9.2'

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2.5.1
        with:
          key: ${{ secrets.SSH_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
          config: |
            Host *
              StrictHostKeyChecking no
              UserKnownHostsFile=/dev/null

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v3.0.1
        with:
          role-to-assume: arn:aws:iam::037129986032:role/github_deploy
          role-session-name: GithubDeploy
          aws-region: ${{ env.AWS_REGION }}

      - id: slack
        name: Notify Deploy Start
        uses: slackapi/slack-github-action@v1.24.0
        with:
          channel-id: 'C09HWCJSVJ6'
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                      "type": "mrkdwn",
                      "text": "*PersonalID Deploy to ${{ inputs.environment }}*"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                      "type": "mrkdwn",
                      "text": "*Status*: In Progress"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                      {
                          "type": "mrkdwn",
                          "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Deploy Run>"
                      }
                  ]
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN}}

      - id: deploy
        working-directory: ./deploy
        run: 'kamal deploy'

      - name: Create Sentry release
        if: ${{ success() }}
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        with:
          environment: ${{ inputs.environment }}
          release: ${{ env.APP_RELEASE }}
          projects: ${{ env.SENTRY_PROJECT }}
          set_commits: manual
          repo: dimagi/connect-id
          commit: ${{ github.sha }}

      - name: Set release tag
        if: ${{ success() && inputs.environment == 'production' }}
        run: echo "RELEASE_TAG=$(date -u +'%Y-%m-%d_%H-%M-%S')" >> "$GITHUB_ENV"

      - name: Create GitHub release
        if: ${{ success() && inputs.environment == 'production' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true

      - name: Update GitHub deployment status
        if: ${{ always() && steps.gh_deployment.outputs.id }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.gh_deployment.outputs.id }}
          # success → success; failure → failure; cancelled or skipped (an earlier step failed) → error
          DEPLOY_STATE: ${{ steps.deploy.conclusion == 'success' && 'success' || steps.deploy.conclusion == 'failure' && 'failure' || 'error' }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f state="${DEPLOY_STATE}" \
            -f log_url="${LOG_URL}" \
            -F auto_inactive=true > /dev/null

      - name: Notify Deploy End
        uses: slackapi/slack-github-action@v1.24.0
        if: always()
        with:
          channel-id: 'C09HWCJSVJ6'
          update-ts: ${{ steps.slack.outputs.ts }}
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                      "type": "mrkdwn",
                      "text": "*PersonalID Deploy to ${{ inputs.environment }}*"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                      "type": "mrkdwn",
                      "text": "*Status*: ${{ steps.deploy.conclusion }}"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                      {
                          "type": "mrkdwn",
                          "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Deploy Run>"
                      }
                  ]
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN}}
