name: Deploy
run-name: Deploy to ${{ inputs.environment || 'production' }} (${{ github.event_name == 'workflow_run' && 'continuous' || 'manual' }})

# Continuous deploy: every push to main deploys once CI passes on it. Deploys never overlap (see the deploy job).
# Manual runs (Actions > Deploy > Run workflow) must be started on main. They deploy right away, without waiting for
# CI, for retries, redeploys and incidents.

env:
  AWS_REGION: 'us-east-1'
  SENTRY_ORG: 'dimagi'
  SENTRY_PROJECT: 'connect-id'
  # Automatic runs have no inputs, so fall back to the defaults
  DEPLOY_ENVIRONMENT: ${{ inputs.environment || 'production' }}
  # On workflow_run, github.sha is the tip of main when this run started, not the commit CI tested
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  DEPLOY_TYPE: ${{ github.event_name == 'workflow_run' && 'continuous' || 'manual' }}

permissions:
  id-token: write
  contents: write
  deployments: write

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        required: true
        default: 'production'
        type: choice
        options:
          - production

jobs:
  check:
    # Only CI runs for pushes to main in this repository. A pull request from a fork's `main` branch
    # also matches `branches: [main]` above, and must never deploy.
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      # Automatic deploys go out only when CI passed, the commit is still the tip of main and it isn't live yet.
      # Manual deploys must be of main, and skip these checks.
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          skip() {
            echo "::notice::$1, skipping deploy."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=$1" >> "$GITHUB_OUTPUT"
            echo "notify_skip=${2:-false}" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ "$GITHUB_EVENT_NAME" != "workflow_run" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Manual deploys must be run on main, not ${GITHUB_REF_NAME}. Merge the change to main first."
              exit 1
            fi
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Failed CI is the one skip worth telling Slack about: main can't deploy until it's fixed
          if [ "$CI_CONCLUSION" != "success" ]; then
            skip "CI did not pass on ${DEPLOY_SHA::7} (${CI_CONCLUSION})" true
          fi

          # CI runs for different commits can finish out of order. Deploying an older commit after a newer
          # one would roll production back, so only the tip of main deploys; its own CI run will handle it.
          main_sha=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$main_sha" != "$DEPLOY_SHA" ]; then
            skip "${DEPLOY_SHA::7} is no longer the tip of main (now ${main_sha::7})"
          fi

          # Releases are only created by successful deploys, so the latest one marks what is live.
          # Catches a re-run of CI on a commit that already went out.
          last_release_tag=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // ""')
          if [ -n "$last_release_tag" ]; then
            last_deployed_sha=$(gh api "repos/$GH_REPO/commits/$last_release_tag" --jq .sha)
            if [ "$last_deployed_sha" = "$DEPLOY_SHA" ]; then
              skip "${DEPLOY_SHA::7} is already live ($last_release_tag)"
            fi
          fi

          echo "should_deploy=true" >> "$GITHUB_OUTPUT"

      - name: Notify Deploy Skipped
        if: ${{ steps.check.outputs.notify_skip == 'true' }}
        uses: slackapi/slack-github-action@v1.24.0
        with:
          channel-id: 'C09HWCJSVJ6'
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                      "type": "mrkdwn",
                      "text": "*PersonalID Deploy to ${{ env.DEPLOY_ENVIRONMENT }}*"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                      "type": "mrkdwn",
                      "text": "*Status*: Skipped\n${{ steps.check.outputs.skip_reason }}"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                      {
                          "type": "mrkdwn",
                          "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Deploy Run>"
                      }
                  ]
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN}}

  deploy:
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    # Set on this job, not the workflow, so a run that skips can't push a pending deploy out of the queue.
    # GitHub keeps at most one pending run per group, the newest, so merges during a deploy go out together.
    concurrency:
      group: deploy-${{ inputs.environment || 'production' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # The check job ran before this one waited its turn in the queue. Ask again now that it is this run's turn:
      # a newer commit may have landed, or gone out, in the meantime. Every later step is gated on this.
      # Manual runs skip it, as they skip the check job's tests.
      - id: recheck
        name: Re-check this is still the commit to deploy
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "workflow_run" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          main_sha=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$main_sha" != "$DEPLOY_SHA" ]; then
            echo "::notice::${DEPLOY_SHA::7} is no longer the tip of main (now ${main_sha::7}), skipping deploy."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_release_tag=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // ""')
          if [ -n "$last_release_tag" ] && \
             [ "$(gh api "repos/$GH_REPO/commits/$last_release_tag" --jq .sha)" = "$DEPLOY_SHA" ]; then
            echo "::notice::${DEPLOY_SHA::7} is already live ($last_release_tag), skipping deploy."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "go=true" >> "$GITHUB_OUTPUT"

      - name: Checkout source code
        if: steps.recheck.outputs.go == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set release identifier
        if: steps.recheck.outputs.go == 'true'
        run: |
          # Sentry release versions cannot contain slashes, so sanitize the ref name
          SAFE_REF_NAME="${GITHUB_REF_NAME//\//-}"
          echo "APP_RELEASE=${SAFE_REF_NAME}.${DEPLOY_SHA}" >> "$GITHUB_ENV"

      # Record the deploy in GitHub's Deployments API so the environment shows what is running there.
      # Created explicitly rather than via the job-level `environment:` key, which would change the
      # OIDC subject used to assume the AWS deploy role and apply environment protection rules.
      # Bookkeeping only: a failure here must not block the deploy.
      - id: gh_deployment
        name: Create GitHub deployment
        if: steps.recheck.outputs.go == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_ENV: ${{ env.DEPLOY_ENVIRONMENT }}
        run: |
          # required_contexts=[] skips GitHub's commit-status check; CI gating is the deploy process's job
          DEPLOYMENT_ID="$(jq -n \
            --arg ref "${DEPLOY_SHA}" \
            --arg environment "${DEPLOY_ENV}" \
            --arg description "${DEPLOY_TYPE} deploy of ${GITHUB_REF_NAME}" \
            --argjson production "${{ env.DEPLOY_ENVIRONMENT == 'production' }}" \
            '{ref: $ref, environment: $environment, description: $description, auto_merge: false,
              required_contexts: [], production_environment: $production}' \
            | gh api "repos/${GITHUB_REPOSITORY}/deployments" --input - --jq '.id')"
          echo "id=${DEPLOYMENT_ID}" >> "$GITHUB_OUTPUT"
          gh api "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f state=in_progress \
            -f log_url="${LOG_URL}" > /dev/null

      - name: Set up Ruby
        if: steps.recheck.outputs.go == 'true'
        uses: actions/setup-ruby@v1

      - name: Install Kamal
        if: steps.recheck.outputs.go == 'true'
        run: gem install kamal -v '~> 1.9.2'

      - name: Install SSH key
        if: steps.recheck.outputs.go == 'true'
        uses: shimataro/ssh-key-action@v2.5.1
        with:
          key: ${{ secrets.SSH_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
          config: |
            Host *
              StrictHostKeyChecking no
              UserKnownHostsFile=/dev/null

      - name: configure aws credentials
        if: steps.recheck.outputs.go == 'true'
        uses: aws-actions/configure-aws-credentials@v3.0.1
        with:
          role-to-assume: arn:aws:iam::037129986032:role/github_deploy
          role-session-name: GithubDeploy
          aws-region: ${{ env.AWS_REGION }}

      - id: slack
        name: Notify Deploy Start
        if: steps.recheck.outputs.go == 'true'
        uses: slackapi/slack-github-action@v1.24.0
        with:
          channel-id: 'C09HWCJSVJ6'
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                      "type": "mrkdwn",
                      "text": "*PersonalID Deploy to ${{ env.DEPLOY_ENVIRONMENT }}*"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                      "type": "mrkdwn",
                      "text": "*Status*: In Progress"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                      {
                          "type": "mrkdwn",
                          "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Deploy Run>"
                      }
                  ]
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN}}

      - id: deploy
        if: steps.recheck.outputs.go == 'true'
        working-directory: ./deploy
        run: 'kamal deploy'

      - name: Create Sentry release
        if: ${{ success() && steps.recheck.outputs.go == 'true' }}
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        with:
          environment: ${{ env.DEPLOY_ENVIRONMENT }}
          release: ${{ env.APP_RELEASE }}
          projects: ${{ env.SENTRY_PROJECT }}
          set_commits: manual
          repo: dimagi/connect-id
          commit: ${{ env.DEPLOY_SHA }}

      - name: Set release tag
        if: ${{ success() && steps.recheck.outputs.go == 'true' && env.DEPLOY_ENVIRONMENT == 'production' }}
        run: echo "RELEASE_TAG=$(date -u +'%Y-%m-%d_%H-%M-%S')" >> "$GITHUB_ENV"

      - name: Create GitHub release
        if: ${{ success() && steps.recheck.outputs.go == 'true' && env.DEPLOY_ENVIRONMENT == 'production' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.DEPLOY_SHA }}
          generate_release_notes: true

      - name: Update GitHub deployment status
        if: ${{ always() && steps.gh_deployment.outputs.id }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.gh_deployment.outputs.id }}
          # success → success; failure → failure; cancelled or skipped (an earlier step failed) → error
          DEPLOY_STATE: ${{ steps.deploy.conclusion == 'success' && 'success' || steps.deploy.conclusion == 'failure' && 'failure' || 'error' }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" \
            -f state="${DEPLOY_STATE}" \
            -f log_url="${LOG_URL}" \
            -F auto_inactive=true > /dev/null

      - name: Notify Deploy End
        uses: slackapi/slack-github-action@v1.24.0
        # Not when the re-check decided to skip: no deploy started, so there is nothing to report
        if: ${{ always() && steps.recheck.outputs.go != 'false' }}
        with:
          channel-id: 'C09HWCJSVJ6'
          update-ts: ${{ steps.slack.outputs.ts }}
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                      "type": "mrkdwn",
                      "text": "*PersonalID Deploy to ${{ env.DEPLOY_ENVIRONMENT }}*"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                      "type": "mrkdwn",
                      "text": "*Status*: ${{ steps.deploy.conclusion }}"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                      {
                          "type": "mrkdwn",
                          "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Deploy Run>"
                      }
                  ]
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN}}
