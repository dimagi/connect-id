name: Deploy
run-name: Deploy to ${{ inputs.environment }} (${{ inputs.deploy_type }})

env:
  AWS_REGION: 'us-east-1'
  SENTRY_ORG: 'dimagi'
  SENTRY_PROJECT: 'connect-id'

permissions:
  id-token: write
  contents: write

on:
  #  workflow_run:
  #    workflows: [CI]
  #    types: [completed]
  #    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        required: true
        default: 'production'
        type: choice
        options:
          - production
      deploy_type:
        description: 'Whether this deploy is part of the regular schedule or an adhoc/hotfix deploy'
        required: true
        default: 'scheduled'
        type: choice
        options:
          - scheduled
          - adhoc

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set release identifier
        run: |
          # Sentry release versions cannot contain slashes, so sanitize the ref name
          SAFE_REF_NAME="${GITHUB_REF_NAME//\//-}"
          echo "APP_RELEASE=${SAFE_REF_NAME}.${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Set up Ruby
        uses: actions/setup-ruby@v1

      - name: Install Kamal
        run: gem install kamal -v '~> 1.9.2'

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2.5.1
        with:
          key: ${{ secrets.SSH_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
          config: |
            Host *
              StrictHostKeyChecking no
              UserKnownHostsFile=/dev/null

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v3.0.1
        with:
          role-to-assume: arn:aws:iam::037129986032:role/github_deploy
          role-session-name: GithubDeploy
          aws-region: ${{ env.AWS_REGION }}

      - id: slack
        name: Notify Deploy Start
        uses: slackapi/slack-github-action@v1.24.0
        with:
          channel-id: 'C09HWCJSVJ6'
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                      "type": "mrkdwn",
                      "text": "*PersonalID Deploy to ${{ inputs.environment }}*"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                      "type": "mrkdwn",
                      "text": "*Status*: In Progress"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                      {
                          "type": "mrkdwn",
                          "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Deploy Run>"
                      }
                  ]
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN}}

      - id: deploy
        working-directory: ./deploy
        run: 'kamal deploy'

      - name: Create Sentry release
        if: ${{ success() }}
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        with:
          environment: ${{ inputs.environment }}
          release: ${{ env.APP_RELEASE }}
          projects: ${{ env.SENTRY_PROJECT }}
          set_commits: manual
          repo: dimagi/connect-id
          commit: ${{ github.sha }}

      - name: Create GitHub release
        if: ${{ success() && inputs.environment == 'production' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="$(date -u +'%Y-%m-%d_%H-%M-%S')"
          # GitHub's automatic previous-tag detection does not reliably pick the most recent
          # release for our timestamp tags (several deploys on one day got notes compared
          # against the same older release), so pass the previous release tag explicitly.
          # Timestamp tags sort chronologically as plain strings.
          PREVIOUS_TAG="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '.[] | select(.draft == false) | .tag_name' \
            | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9]{2}-[0-9]{2}-[0-9]{2}$' \
            | sort | tail -n 1 || true)"
          NOTES_ARGS=(--generate-notes)
          if [ -n "$PREVIOUS_TAG" ]; then
            NOTES_ARGS+=(--notes-start-tag "$PREVIOUS_TAG")
          fi
          echo "Creating release $RELEASE_TAG (previous: ${PREVIOUS_TAG:-none})"
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            "${NOTES_ARGS[@]}"

      - name: Notify Deploy End
        uses: slackapi/slack-github-action@v1.24.0
        if: always()
        with:
          channel-id: 'C09HWCJSVJ6'
          update-ts: ${{ steps.slack.outputs.ts }}
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                      "type": "mrkdwn",
                      "text": "*PersonalID Deploy to ${{ inputs.environment }}*"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                      "type": "mrkdwn",
                      "text": "*Status*: ${{ steps.deploy.conclusion }}"
                  }
                },
                {
                  "type": "context",
                  "elements": [
                      {
                          "type": "mrkdwn",
                          "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Deploy Run>"
                      }
                  ]
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN}}
